services:
  postgres:
    image: postgres:17
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:11
    container_name: marketplace-flyway
    command:
      - "-url=jdbc:postgresql://postgres:5432/marketplace"
      - "-user=postgres"
      - "-password=postgres"
      - "-connectRetries=60"
      - "migrate"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migration:/flyway/sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-app
    environment:
      APP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/marketplace
    ports:
      - "8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully

volumes:
  postgres_data:
