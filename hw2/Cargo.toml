[package]
name = "marketplace"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["server"]
server = []
conversion = []

[dependencies]
ammonia = "4.1.2"
anyhow = "1.0.98"
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["multipart"] }
axum-extra = { version = "0.12.2", features = ["cookie", "query", "typed-header"] }
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
headers = "0.4.1"
http = "1.3.1"
lazy_static = "1.5.0"
regex = "1.11.2"
serde = { version = "1.0.226", features = ["derive"] }
serde_html_form = "0.2.8"
serde_json = { version = "1.0.145", features = ["raw_value"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }
rust_decimal = { version = "1.38.0", features = ["serde-with-str"] }
tokio = { version = "1.47.1", features = ["signal", "rt-multi-thread", "macros"] }
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
