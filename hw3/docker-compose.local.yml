name: hw3-local

services:
  booking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "15433:5432"
    volumes:
      - booking-db-local-data:/var/lib/postgresql/data

  flight-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    ports:
      - "15434:5432"
    volumes:
      - flight-db-local-data:/var/lib/postgresql/data

  redis-master:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --protected-mode
      - "no"
    volumes:
      - redis-master-local-data:/data

  redis-replica:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --protected-mode
      - "no"
      - --replicaof
      - redis-master
      - "6379"
    depends_on:
      redis-master:
        condition: service_started
    volumes:
      - redis-replica-local-data:/data

  redis-sentinel:
    image: redis:8-alpine
    command:
      - sh
      - -c
      - cp /opt/redis/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf
    depends_on:
      redis-master:
        condition: service_started
      redis-replica:
        condition: service_started
    ports:
      - "16379:26379"
    volumes:
      - ./infra/redis/sentinel.conf:/opt/redis/sentinel.conf:ro

volumes:
  booking-db-local-data:
  flight-db-local-data:
  redis-master-local-data:
  redis-replica-local-data:
